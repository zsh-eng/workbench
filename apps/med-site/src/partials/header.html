<header class="top">
  <div class="wide">
    <a class="brand" href="/" aria-label="Med">
      <!-- Med's icon (apps/med/scripts/render-icons.mjs): Reflection on a
           painted sea, dawn or moonrise with the system's colour scheme,
           as the screenshots are. -->
      <picture>
        <source
          media="(prefers-color-scheme: dark)"
          srcset="{{asset:/icon-night.svg}}"
        />
        <img
          class="mark"
          src="{{asset:/icon-dawn.svg}}"
          alt=""
          width="26"
          height="26"
        />
      </picture>
      <!-- The wordmark: monoline strokes on a 100-unit x-height. The m's
           arches and the round letters are circles, as in the icon. -->
      <svg
        class="word"
        viewBox="0 -142 389 146"
        fill="none"
        stroke="currentColor"
        stroke-width="17.5"
        aria-hidden="true"
      >
        <path
          d="M8.75 0V-58.25A33 33 0 0 1 74.75 -58.25V0M74.75 -58.25A33 33 0 0 1 140.75 -58.25V0"
        />
        <path
          d="M172.25 -50A44.25 44.25 0 0 1 260.75 -50M172.25 -50A44.25 44.25 0 0 0 251.37 -22.76"
        />
        <path stroke-width="14.35" d="M163.5 -50H269.5" />
        <path
          d="M291.25 -50A44.25 44.25 0 1 1 379.75 -50A44.25 44.25 0 1 1 291.25 -50ZM379.75 0V-142"
        />
      </svg>
    </a>
    <nav aria-label="Project">
      <a href="/#features">Features</a>
      <a href="{{links.docs}}">Docs</a>
      <a href="{{links.github}}">GitHub</a>
    </nav>
  </div>
</header>
