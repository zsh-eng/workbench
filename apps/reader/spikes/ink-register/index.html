<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ink register spike</title>
    <style>
      :root {
        --paper: #f6efdf;
        --ink: #2a2622;
        --chrome: #6b645a;
      }
      html,
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }
      body {
        padding: 0 16px;
        font:
          12px/16px ui-monospace,
          Menlo,
          monospace;
      }
      #status {
        height: 64px;
        overflow: hidden;
        color: var(--chrome);
        white-space: pre-wrap;
      }
      .copy {
        position: relative;
        background: var(--paper);
        margin-bottom: 12px;
      }
      .copy canvas {
        position: absolute;
        left: 0;
        top: 0;
      }
      .copy .page {
        position: absolute;
      }
      .copy.ink .page {
        color: transparent;
      }
      .marker {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #ff00ff;
      }
      .probe {
        display: inline-block;
        width: 0;
        height: 0;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading…</div>
    <div id="copies"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
