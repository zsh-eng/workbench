<svg xmlns="http://www.w3.org/2000/svg" width="480" height="662" viewBox="0 0 480 662">
  <!-- The cloth board is the surface; the coloured plate is set into it, a
       window onto the garden. Inside: the sky and wall far back, the hedges
       nearer, the Duchess and Alice nearest, rounded. -->
  <defs>
    <filter id="s"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="f"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="garden" x1="0" y1="105" x2="0" y2="570" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#444"/><stop offset="0.45" stop-color="#5e5e5e"/><stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
  </defs>
  <rect width="480" height="662" fill="#fff"/>
  <rect x="82" y="96" width="330" height="481" fill="#d8d8d8" filter="url(#s)"/>
  <rect x="90" y="104" width="314" height="465" fill="url(#garden)" filter="url(#s)"/>
  <g fill="#b0b0b0" filter="url(#f)">
    <circle cx="205" cy="228" r="52"/>
    <path d="M150,290 L178,262 L232,262 L250,300 L246,420 L250,520 L230,545 L150,530 L140,450 Z"/>
    <circle cx="266" cy="262" r="26"/>
    <path d="M238,290 L295,288 L322,330 L332,450 L300,470 L290,560 L250,560 L246,470 L232,450 Z"/>
  </g>
</svg>
