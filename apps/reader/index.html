      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape) and (prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-startup-image"
      data-scheme="dark"
      href="/launch/dark-1536x2048.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-startup-image"
      data-scheme="dark"
      href="/launch/dark-2048x1536.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape) and (prefers-color-scheme: dark)"
    />
    <!-- launch-screens:end -->

    <!-- Inline script to apply theme immediately before render to prevent flash -->
    <script>
      (function () {
        const STORAGE_KEY = "epub-reader-settings";
        const APPEARANCE_STORAGE_KEY = "epub-reader-appearance";
        const THEME_CLASSES = [
          "light",
          "dark",
          "night",
          "flexoki-light",
          "flexoki-dark",
        ];
        const DEFAULT_THEME = "light";

        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          const settings = stored ? JSON.parse(stored) : null;
          let theme =
            settings?.theme && THEME_CLASSES.includes(settings.theme)
              ? settings.theme
              : DEFAULT_THEME;
          const appearance = localStorage.getItem(APPEARANCE_STORAGE_KEY);
          if (appearance === "system") {
            const useDarkTheme = matchMedia(
              "(prefers-color-scheme: dark)",
            ).matches;
            const useFlexoki = theme.startsWith("flexoki");
            const useNight = theme === "night";
            if (useFlexoki) {
              theme = useDarkTheme ? "flexoki-dark" : "flexoki-light";
            } else if (useNight) {
              theme = useDarkTheme ? "night" : "light";
            } else {
              theme = useDarkTheme ? "dark" : "light";
            }
          }
          document.documentElement.classList.add(theme);
          // Launch screens follow the system's scheme. With Light or Dark
          // chosen here, keep only that one, so the screen iOS keeps when
          // Reader is added to the Home Screen matches the first paint.
          if (appearance !== "system") {
            const scheme = ["dark", "night", "flexoki-dark"].includes(theme)
              ? "dark"
              : "light";
            document
              .querySelectorAll('link[rel="apple-touch-startup-image"]')
              .forEach((link) => {
                if (link.dataset.scheme !== scheme) link.remove();
                else
                  link.media = link.media.replace(
                    / and \(prefers-color-scheme: \w+\)/,
                    "",
                  );
              });
          }
          if (theme === "night") {
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute("content", "#000000");
          }
        } catch (e) {
          document.documentElement.classList.add(DEFAULT_THEME);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
