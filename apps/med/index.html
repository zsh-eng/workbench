<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#171717" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Med</title>
    <script>
      // The theme's frame color for the first frame, before the app loads (themes.ts).
      try {
        // With nothing chosen: System, between Pierre Light and Pierre Dark.
        const paint = JSON.parse(localStorage.getItem("med:theme-paint") ?? "null") ?? {
          mode: "system",
          light: "#f5f5f5",
          dark: "#171717",
        };
        const dark =
          paint.mode === "dark" ||
          (paint.mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        const root = document.documentElement;
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? paint.dark : paint.light;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
